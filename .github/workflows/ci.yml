name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Node (lint · typecheck · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @clipforge/db generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @clipforge/api test

  python:
    name: Python AI service (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        working-directory: services/ai
        run: pip install -e ".[dev]"
      - name: Test
        working-directory: services/ai
        run: pytest -q

  e2e:
    name: Web e2e (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @clipforge/web exec playwright install --with-deps chromium
      - run: pnpm --filter @clipforge/web build
      - run: pnpm --filter @clipforge/web test
        env:
          CI: "true"
