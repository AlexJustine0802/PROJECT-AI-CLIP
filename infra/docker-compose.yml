# ClipForge — full local stack. `docker compose -f infra/docker-compose.yml up`
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clipforge
      POSTGRES_PASSWORD: clipforge
      POSTGRES_DB: clipforge
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: clipforge
      MINIO_ROOT_PASSWORD: clipforge
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio:/data"]

  # Creates the bucket on startup.
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until (mc alias set local http://minio:9000 clipforge clipforge) do sleep 2; done;
      mc mb -p local/clipforge || true;
      mc anonymous set download local/clipforge || true;
      exit 0;"

  ai:
    build:
      context: ../services/ai
    environment:
      AI_USE_STUBS: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    ports: ["8000:8000"]

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://clipforge:clipforge@postgres:5432/clipforge?schema=public
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai:8000
      API_URL: http://api:4000
      WEB_URL: http://localhost:3000
      STORAGE_PROVIDER: minio
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: clipforge
      S3_SECRET_ACCESS_KEY: clipforge
      JWT_SECRET: dev-insecure-secret-change-me
    ports: ["4000:4000"]

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    depends_on: [api]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: ws://localhost:4000
      AUTH_SECRET: dev-insecure-secret-change-me
      AUTH_URL: http://localhost:3000
    ports: ["3000:3000"]

volumes:
  pgdata:
  minio:
